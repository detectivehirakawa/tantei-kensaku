# 全国探偵検索：掲載が承認されたら（GAS が tantei-portal-data を更新したら）、
# 1) 掲載ページを「ひと目でわかる表・紹介文・プロフィール表」の構成に組み直す（render_listed.py）。
#    承認時の GAS や手元のフルリビルドは以前の構成で書き出すので、業者ページが更新されたときも実行する。
# 2) その探偵社のホームページの最初の1画面を撮って「お近くの掲載済み探偵」のカード背景に使う。
name: listed-hero
on:
  push:
    branches: [main]
    paths:
      - 'tantei-portal-data/permitted.json'
      - 'tantei-portal-data/biz_extra.json'
      - 'tantei-portal-data/biz_profile.json'
      - 'tantei-portal-tools/render_listed.py'
      - 'tantei-portal-data/gbp.json'
      - 'tantei-portal-data/biz_web.json'
      - 'tantei-portal-data/display_no.json'
      - 'all.json'
      - 'tantei-portal-tools/listed_geo.py'
      - 'tantei-portal-tools/render_recent.py'
      - 'tantei-portal-tools/render_listed_order.py'
      - 'tantei-portal-tools/render_gashi_banner.py'
      - 'tantei-portal-tools/make_sitemap.py'
      - 'all.json'
      - 'biz/*.html'
  workflow_dispatch:
    inputs:
      force:
        description: '撮り直す届出番号（カンマ区切り）'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: listed-hero
  cancel-in-progress: false
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 掲載ページを新しい構成に組み直す
        continue-on-error: true
        run: python tantei-portal-tools/render_listed.py
      - name: Googleマップの★評価・ホームページで確認した調査項目を掲載ページに反映（APIは呼ばない）
        continue-on-error: true
        run: |
          python tantei-portal-tools/google_rating.py render
          python tantei-portal-tools/render_hp_types.py
          python tantei-portal-tools/render_neighbors.py
          python tantei-portal-tools/render_display_no.py
          python tantei-portal-tools/render_kanri_no.py
          python tantei-portal-tools/render_llmo.py
          python tantei-portal-tools/render_city_extra.py
      - name: 日本語フォントと Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          pip install -q pillow
      - name: 撮影
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python tantei-portal-tools/listed_heroes.py
      - name: 公式サイトの画像を掲載ページ上部の帯の背景にする（掲載済み全社）
        continue-on-error: true
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python tantei-portal-tools/listed_bg.py
      - name: 掲載済み全社の地図ピンの位置を計算（listed_geo.json。承認のたびに自動・2026-11-17 運営者指示）
        continue-on-error: true
        run: python tantei-portal-tools/listed_geo.py
      - name: トップの「最近掲載された探偵社」欄を更新（render_recent.py・listed_dates.json。2026-11-18 運営者指示）
        continue-on-error: true
        run: python tantei-portal-tools/render_recent.py
      - name: 都道府県・市区町村ページの掲載済みの並びを文字の量が多い順に（render_listed_order.py。2026-11-19 運営者指示）
        continue-on-error: true
        run: python tantei-portal-tools/render_listed_order.py
      - name: トップ・一覧に賀詞交歓会のバナー（render_gashi_banner.py。開催日を過ぎたら自動で撤去。2026-11-19 運営者指示）
        continue-on-error: true
        run: python tantei-portal-tools/render_gashi_banner.py
      - name: sitemap.xml を更新（lastmod は中身が変わったページだけ今日にする。2026-11-18）
        continue-on-error: true
        run: python tantei-portal-tools/make_sitemap.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 承認（GAS）が同時に biz/*.html などを更新すると rebase が競合する。そのときは最新の main に戻して
          # 組み直しをやり直す（GAS 側の変更を消さない）。最後まで push できなければ失敗として表示する（2026-11-17）。
          MSG="全国探偵検索: 掲載済み探偵社の掲載ページの構成・ヒーロー画像を更新（自動）"
          add() { git add img/listed biz *.html */*.html tantei-portal-data/listed_geo.json tantei-portal-data/listed_dates.json sitemap.xml tantei-portal-data/sitemap_lastmod.json; }
          add
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "$MSG"
          SNAP=$(git rev-parse HEAD)
          for n in 1 2 3 4 5 6; do
            if git pull --rebase -q && git push -q; then echo "push しました（${n}回目）"; exit 0; fi
            echo "競合したので最新の main の上でやり直します（${n}回目）"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            git checkout "$SNAP" -- img/listed tantei-portal-data/listed_geo.json tantei-portal-data/listed_dates.json tantei-portal-data/sitemap_lastmod.json 2>/dev/null || true
            bash tantei-portal-tools/listed_all.sh
            add
            if git diff --cached --quiet; then echo "最新の main で反映済み"; exit 0; fi
            git commit -q -m "$MSG"
            sleep $((n * 5))
          done
          echo "::error::書き戻しを6回試しましたが push できませんでした"
          exit 1
      - name: 変わったページを IndexNow（Bing など）に知らせる
        continue-on-error: true
        run: python tantei-portal-tools/indexnow_ping.py "${{ github.event.before }}"
